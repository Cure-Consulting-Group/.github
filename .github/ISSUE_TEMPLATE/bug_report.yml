name: "🐛 Bug Report"
description: "Report a bug or regression in a Cure Consulting Group application or service"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue. Please provide detailed reproduction steps.
  - type: checkboxes
    id: platforms
    attributes:
      label: Affected Platform(s)
      description: Which platforms are impacted by this defect?
      options:
        - label: Web (`apps/web`)
        - label: iOS (`apps/ios`)
        - label: Android (`apps/android`)
        - label: Chrome Extension (`apps/extension`)
        - label: Backend / Cloud Functions (`services/`)
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Navigate to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Screenshots
      description: Paste stack traces or drag-and-drop screenshots/screen recordings.
      render: shell
